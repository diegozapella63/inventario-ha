name: InventarIA
version: "1.7.0"
slug: inventario
description: Inventário da casa com fotos, valores, relatório para seguro e leitura de fotos por IA.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:package-variant-closed
panel_title: InventarIA
homeassistant_api: true
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
watchdog: "tcp://[HOST]:[PORT:8099]"
backup_exclude:
  - "tmp/*"
