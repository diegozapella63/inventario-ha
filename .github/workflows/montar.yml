name: Montar pacote
on:
  push:
    paths: [pacote.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o pacote.zip
          rm pacote.zip
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Monta o app Inventário"
          git push
