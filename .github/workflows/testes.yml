name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unitários e integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tests/run.sh

  visual:
    name: Visuais (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: tests/e2e/run.sh
        env:
          E2E_TMP: ${{ runner.temp }}/e2e
          E2E_JOBS: "3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e-saidas
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  # os arquivos que são iguais nos apps da família (tools/iguais.py): baixa os outros apps e compara
  iguais:
    name: Arquivos iguais aos dos outros apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: inventario-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/gerencia-ha
          path: gerencia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/economia-ha
          path: economia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/CorrerIA-ha
          path: correria-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/resolvia-ha
          path: resolvia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/cronologia-ha
          path: cronologia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/memoria-ha
          path: memoria-ha
      - run: python3 inventario-ha/tools/iguais.py --exigir
