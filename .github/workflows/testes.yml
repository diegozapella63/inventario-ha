name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unitários e integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tests/run.sh

  visual:
    name: Visuais (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: tests/e2e/run.sh
        env:
          E2E_TMP: ${{ runner.temp }}/e2e
          E2E_JOBS: "3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e-saidas
          path: ${{ runner.temp }}/e2e
          retention-days: 7
